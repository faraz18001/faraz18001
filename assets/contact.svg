          color: #8b949e;
          font-weight: 400;
        }
      </style>
      <div class="contact-card">
        <div class="contact-row">
          <span class="contact-label">Email</span>
          <span class="contact-value">syedfaraz1900@gmail.com</span>
        </div>
        <div class="contact-row">
          <span class="contact-label">Portfolio</span>
          <span class="contact-value">faraz-portfolio-url.com</span>
        </div>
        <div class="contact-row">
          <span class="contact-label">LinkedIn</span>
          <span class="contact-value">linkedin.com/in/YOUR_LINKEDIN_USERNAME</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
