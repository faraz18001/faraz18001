<svg fill="none" viewBox="0 0 800 160" width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .stack-card {
          width: 100%;
          height: 150px;
          background: #0d1117;
          color: #e6edf3;
          padding: 24px 40px;
          border-radius: 16px;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          border: 1px solid #21262d;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 10px;
        }
        .stack-row {
          display: flex;
          align-items: center;
          gap: 0;
          font-size: 13px;
          line-height: 1;
        }
        .stack-label {
          color: #e6edf3;
          font-weight: 600;
          width: 110px;
          flex-shrink: 0;
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .stack-items {
          color: #8b949e;
          font-weight: 400;
        }
        .stack-sep {
          color: #30363d;
          margin: 0 8px;
        }
      </style>
      <div class="stack-card">
        <div class="stack-row">
          <span class="stack-label">Frameworks</span>
          <span class="stack-items">FastAPI<span class="stack-sep">·</span>React<span class="stack-sep">·</span>Next.js<span class="stack-sep">·</span>Vite</span>
        </div>
        <div class="stack-row">
          <span class="stack-label">ML / AI</span>
          <span class="stack-items">LangChain<span class="stack-sep">·</span>OpenAI<span class="stack-sep">·</span>HuggingFace<span class="stack-sep">·</span>Ollama<span class="stack-sep">·</span>FAISS<span class="stack-sep">·</span>Prophet</span>
        </div>
        <div class="stack-row">
          <span class="stack-label">Infra</span>
          <span class="stack-items">Docker<span class="stack-sep">·</span>PostgreSQL<span class="stack-sep">·</span>Linux<span class="stack-sep">·</span>Jupyter</span>
        </div>
        <div class="stack-row">
          <span class="stack-label">Tools</span>
          <span class="stack-items">Python<span class="stack-sep">·</span>Git<span class="stack-sep">·</span>GitHub<span class="stack-sep">·</span>VS Code</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
